name: unixnu-fuxi kernel

# Builds the fuxi XNU kernel with the UniXNU harness on a macOS runner.
#
# Why here: the harness needs Xcode (iig, SDK); this host has 15.2 which is too
# old for xnu-10063, and the Mac upgrade is deferred. macos-14 images carry
# Xcode 16, which is the version UniXNU targets.
#
# The device repository is not published, so it ships inside this repository as
# unixnu-fuxi/ and is passed with -D. Only the kernel step runs here: firmware
# is built locally (it needs no Xcode) and is not part of this job.

on:
  workflow_dispatch:
  push:
    paths:
      - 'unixnu-fuxi/**'
      - '.github/workflows/unixnu-kernel.yml'

jobs:
  kernel:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          echo "installed:"; ls /Applications | grep -i '^Xcode' || true
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${XCODE}" ]; then
            echo "::error::no Xcode 16 on this runner; xnu-10063 cannot build with the default toolchain"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcode-select -p
          xcodebuild -version
          # The harness calls xcrun/iig directly; fail here, not 10 minutes in.
          xcrun --find iig

      - name: Fetch UniXNU
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git unixnu
          git -C unixnu log --oneline -1

      - name: Configure for fuxi
        run: |
          set -euo pipefail
          cd unixnu
          ./unixnu defconfig fuxi_defconfig -D "$GITHUB_WORKSPACE/unixnu-fuxi"
          ./unixnu fetch
          ./unixnu tree
          echo "--- resolved config"
          grep -E 'UFS|ADRENO|LEGACY_DISPLAY' out/fuxi/.config || true

      - name: Seed placeholder archives
        run: |
          set -euo pipefail
          # build-xnu-4k-baseline.sh guards every optional archive with a bare
          # `test -f`, and the script runs under `set -e`: on a fresh tree the
          # bootstrap pass therefore exits silently before it compiles anything,
          # so the compile records the archive builders need are never written
          # and the harness raises. The harness's own comment says that pass is
          # meant to "stop at the link" instead.
          #
          # Seeding empty (valid) archives satisfies the guards without inventing
          # content: the pass compiles, fails at the link, leaves the records,
          # and the harness then builds the real archives and links again.
          TREE=unixnu/out/fuxi/tree
          cd "$TREE"
          for a in \
            build/adreno-firmware-probe/libAdrenoFirmwareProbe.a \
            build/adreno-pm4-probe/libAdrenoPM4Probe.a \
            build/armcpu/libArmCpu.a \
            build/armdt-platform/libArmDTPlatform.a \
            build/armvirt-platform/libArmVirtPlatform.a \
            build/boot-progress/libBootProgress.a \
            build/constant-uploads-probe/libConstantUploadsProbe.a \
            build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a \
            build/libpthread-kernel/libpthread_kernel.a \
            build/mockfs-fixture/libmockfs_fixture.a \
            build/native-adreno/libNativeAdreno.a \
            build/native-aes/libNativeAES.a \
            build/native-legacy-display/libNativeLegacyDisplay.late.a \
            build/native-mobile-display/libNativeMobileDisplay.late.a \
            build/native-offline-gpu/libNativeOfflineGPU.late.a \
            build/native-ram-block/libNativeRamBlock.a \
            build/native-ufs/libNativeUfs.a \
            build/native-virtio-block/libNativeVirtioBlock.a \
            build/native-virtio-console/libNativeVirtioConsole.a \
            build/verified-root-xnu/libVerifiedRootProbe.a \
          ; do
            mkdir -p "$(dirname "$a")"
            [ -f "$a" ] || ar crs "$a"
          done
          # Object-file guards need a file, not an archive.
          : > build/libpthread-kernel/source_pthread_bootstrap.o
          ar rcs build/native-ram-block/NativeRamBlock.o.tmp && mv build/native-ram-block/NativeRamBlock.o.tmp build/native-ram-block/NativeRamBlock.o
          echo "seeded $(find build -name '*.a' -newer "$TREE/board.toml" 2>/dev/null | wc -l) archives"

      - name: Build kernel
        run: |
          set -euo pipefail
          cd unixnu
          ./unixnu build kernel 2>&1 | tee "out/fuxi/kernel-build.log"

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel
          if-no-files-found: warn
          path: |
            unixnu/out/fuxi/kernel/**
            unixnu/out/fuxi/kernel-build.log
            unixnu/out/fuxi/logs/**

      - name: Summarise
        if: always()
        run: |
          {
            echo "### unixnu-fuxi kernel"
            echo '```'
            tail -40 unixnu/out/fuxi/kernel-build.log 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
